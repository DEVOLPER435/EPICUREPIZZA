<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
  <title id="title">Happy cartoon pizza</title><desc id="desc">A bright golden cartoon pizza with pepperoni, basil and stretchy mozzarella.</desc>
  <defs>
    <linearGradient id="crust" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffd66a"/><stop offset=".52" stop-color="#f7a934"/><stop offset="1" stop-color="#d75b25"/></linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#fff39a"/><stop offset="1" stop-color="#ffc744"/></linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <ellipse cx="385" cy="518" rx="270" ry="37" fill="#07080c" opacity=".42" filter="url(#shadow)"/>
